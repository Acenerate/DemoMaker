<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klick-Zen: Using Buttons in the Help Center Ticket View</title>
<meta name="description" content="An animated walkthrough: put Klick-Zen one-click buttons on the page where customers view their tickets in your Zendesk Help Center.">
<link rel="icon" href="../../framework/assets/favicon.ico">
<link rel="stylesheet" href="../../framework/engine/player.css">
<link rel="stylesheet" href="../../framework/kit/klickzen.css">
<style>
  /* Custom scenes for this walkthrough. Every class and id is prefixed hc- so kit changes can't reach
     them; only the Zendesk sidebar (KZKit.zdNav) and the browser frame (KZKit.browserScene) come from the kit. */

  /* ---------- scene "hcapp": Zendesk with the Klick-Zen app's button list ---------- */
  .hc-shell { position: absolute; inset: 0; display: flex; background: #f8f9f9; font-family: "Segoe UI", system-ui, sans-serif; }
  .hc-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .hc-top { height: 50px; background: #fff; border-bottom: 1px solid #d8dcde; display: flex; align-items: center; padding: 0 18px; gap: 10px; flex: none; }
  .hc-tab { height: 50px; display: flex; align-items: center; padding: 0 16px; border-right: 1px solid #e9ebed; font-size: 13px; color: #49545c; }
  .hc-tab.hc-on { box-shadow: inset 0 -3px 0 #1f73b7; color: #2f3941; font-weight: 600; }
  .hc-top { position: relative; z-index: 5; }

  .hc-pmenu div { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 4px; }
  .hc-pmenu svg { flex: none; color: #49545c; }

  .hc-sp { flex: 1; }

  .hc-body { flex: 1; position: relative; overflow: hidden; }
  .hc-views { position: absolute; inset: 0; padding: 24px 30px; }

  .hc-vrow { display: grid; grid-template-columns: 110px 1fr 200px 140px; padding: 13px 10px; border-bottom: 1px solid #e9ebed; font-size: 14px; color: #2f3941; background: #fff; }
  .hc-vrow.hc-h { background: none; font-weight: 600; color: #68737d; font-size: 12.5px; }

  .hc-vb.o { background: #e34f32; } .hc-vb.p { background: #3091ec; } .hc-vb.n { background: #ffb648; color: #703b15; }

  .hc-kz { position: absolute; inset: 0; background: #f6f8f8; display: flex; flex-direction: column; opacity: 0; transform: translateX(40px); transition: opacity .5s, transform .5s; pointer-events: none; }

  .hc-side { width: 250px; flex: none; padding: 22px 18px; border-right: 1px solid #e3e8e9; }

  .hc-side div { padding: 7px 12px; border-radius: 6px; font-size: 14px; color: #33434a; transition: background .25s; }
  .hc-side div.hc-sel { background: #d3e4f3; font-weight: 600; color: #1d2b30; }
  .hc-content { flex: 1; position: relative; min-width: 0; }
  .hc-page { position: absolute; inset: 0; padding: 24px 30px; opacity: 0; transition: opacity .35s; }
  .hc-page.hc-on { opacity: 1; }
  .hc-titlebar { display: flex; align-items: center; justify-content: space-between; }
  .hc-titlebar h2 { margin: 0; font-size: 22px; font-weight: 400; color: #1d2b30; }
  .hc-titlebar h2 b { font-weight: 700; }
  .hc-create { background: #1f6eb6; color: #fff; border-radius: 4px; padding: 9px 16px; font-size: 13.5px; font-weight: 600; }
  .hc-welcome { margin-top: 22px; background: #fff; border: 1px solid #e3e8e9; border-radius: 8px; padding: 22px 26px; font-size: 14px; color: #33434a; line-height: 1.55; }

  .hc-snip code { flex: 1; padding: 0 12px; font: 12.5px/1 Consolas, monospace; color: #33434a; white-space: nowrap; overflow: hidden; }
  .hc-snip code b { font-weight: 400; border-radius: 3px; padding: 1px 3px; transition: background .3s; }

  .hc-snip i.hc-ok { background: #2e8540; }
  .hc-snip em { position: absolute; right: 52px; top: 50%; transform: translateY(-50%); background: #2f3941; color: #fff; font: 600 12px/1 "Segoe UI", sans-serif; font-style: normal; padding: 6px 9px; border-radius: 4px; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  .hc-snip em.hc-on { opacity: 1; }

  /* ---------- scene "guide": Guide admin, themes, theme settings, code editor ---------- */
  .hc-g { position: absolute; inset: 0; display: flex; background: #f8f9f9; font-family: "Segoe UI", system-ui, sans-serif; }
  .hc-gnav { width: 60px; background: #03363d; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 6px; flex: none; }

  .hc-gico { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: #9fb4b7; position: relative; }

  .hc-gtop { height: 50px; background: #fff; border-bottom: 1px solid #d8dcde; display: flex; align-items: center; padding: 0 22px; gap: 16px; flex: none; font-size: 13.5px; color: #49545c; }
  .hc-gtop b { font-size: 15px; color: #2f3941; }
  .hc-gpage { position: absolute; inset: 0; opacity: 0; transition: opacity .35s; pointer-events: none; }
  .hc-gpage.hc-on { opacity: 1; }
  .hc-gpad { padding: 26px 36px; }

  .hc-gsub { margin: 0 0 22px; font-size: 14px; color: #68737d; }
  .hc-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .hc-stat { background: #fff; border: 1px solid #e3e8e9; border-radius: 8px; padding: 18px 20px; font-size: 13px; color: #68737d; }
  .hc-stat b { display: block; font-size: 28px; color: #2f3941; font-weight: 600; margin-bottom: 4px; }
  .hc-glist { margin-top: 22px; background: #fff; border: 1px solid #e3e8e9; border-radius: 8px; }
  .hc-glist div { padding: 13px 20px; border-bottom: 1px solid #eef1f2; font-size: 14px; color: #2f3941; display: flex; justify-content: space-between; }
  .hc-glist div span { color: #87929d; font-size: 13px; }
  .hc-glist div:last-child { border-bottom: 0; }

  .hc-sect { font-size: 13px; font-weight: 700; color: #49545c; letter-spacing: .03em; margin: 0 0 12px; }
  .hc-themes { display: flex; gap: 26px; }
  .hc-theme { width: 330px; background: #fff; border: 1px solid #d8dcde; border-radius: 8px; position: relative; transition: opacity .4s, transform .4s; }
  .hc-theme.hc-hide { opacity: 0; transform: translateY(10px); }
  .hc-thumb { height: 180px; border-radius: 8px 8px 0 0; background: #eef3f4; padding: 14px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .hc-thumb .t1 { height: 16px; background: #fff; border-radius: 3px; }
  .hc-thumb .t2 { height: 62px; background: #03363d; border-radius: 3px; display: grid; place-items: center; }
  .hc-thumb .t2 i { width: 60%; height: 12px; background: #fff; border-radius: 99px; }
  .hc-thumb .t3 { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .hc-thumb .t3 i { background: #fff; border-radius: 3px; }
  .hc-tfoot { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid #e9ebed; font-size: 14px; color: #2f3941; }
  .hc-tfoot b { font-weight: 600; flex: 1; }
  .hc-live { background: #d1e8df; color: #186146; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
  .hc-more { width: 28px; height: 28px; border-radius: 4px; display: grid; place-items: center; color: #68737d; font-weight: 700; letter-spacing: 1px; }
  .hc-cust { color: #1f73b7; font-weight: 600; font-size: 13.5px; }
  .hc-menu { position: absolute; right: 70px; top: calc(100% - 8px); width: 150px; background: #fff; border: 1px solid #d8dcde; border-radius: 6px; box-shadow: 0 10px 24px rgba(0,0,0,.15); padding: 6px 0; font-size: 13.5px; color: #2f3941; opacity: 0; transform: translateY(-4px); transition: opacity .2s, transform .2s; z-index: 2; }
  .hc-menu.hc-on { opacity: 1; transform: none; }
  .hc-menu div { padding: 8px 14px; }
  .hc-menu div.hc-hov { background: #edf7ff; }

  .hc-tset { position: absolute; inset: 0; display: flex; }

  .hc-tpanel p { margin: 0 0 18px; font-size: 12.5px; color: #87929d; }

  .hc-tprev { flex: 1; padding: 26px; }

  .hc-editcode { position: absolute; right: 28px; bottom: 24px; background: #1f73b7; color: #fff; border-radius: 4px; padding: 11px 20px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 16px rgba(0,0,0,.18); }

  .hc-ced { position: absolute; inset: 0; display: flex; background: #fff; }
  .hc-tree { width: 250px; flex: none; background: #f8f9f9; border-right: 1px solid #d8dcde; padding: 14px 0; font-size: 13px; color: #49545c; }
  .hc-tree div { padding: 5px 18px 5px 34px; white-space: nowrap; }

  .hc-edit { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* ---------- scene "portal": the customer's ticket in the Help Center ---------- */

  .hc-ptoast { position: absolute; left: 50%; top: 64px; transform: translate(-50%, -10px); opacity: 0; background: #2f3941; color: #fff; padding: 12px 20px; border-radius: 6px; font-size: 14px; display: flex; gap: 10px; align-items: center; transition: opacity .3s, transform .3s; z-index: 5; }
