<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klick-Zen Online Template Generator | Klick-Zen</title>
<link rel="icon" href="../../framework/assets/favicon.ico">
<link rel="stylesheet" href="../../framework/engine/player.css">
<link rel="stylesheet" href="../../framework/kit/klickzen.css">
<style>
  /* Online Template Generator: custom scenes (tg- prefix). Sized for the 1280x720 stage. */
  .tg-scene { background: #cfd8dc; }
  .tg-win { position: absolute; left: 40px; top: 22px; right: 40px; bottom: 22px; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.22); display: flex; flex-direction: column; }
  .tg-bar { height: 44px; flex: none; background: #dee3e8; display: flex; align-items: center; gap: 12px; padding: 0 16px; position: relative; }
  .tg-dots { display: flex; gap: 7px; }
  .tg-dots i { width: 12px; height: 12px; border-radius: 50%; background: #f26b5b; }
  .tg-dots i:nth-child(2) { background: #f6be4f; } .tg-dots i:nth-child(3) { background: #5fc454; }
  .tg-url { flex: 1; height: 28px; background: #fff; border-radius: 99px; display: flex; align-items: center; padding: 0 16px; font-size: 13px; color: #4b5a66; }
  .tg-dlfile { position: absolute; right: 14px; top: 50px; z-index: 6; width: 400px; background: #fff; border: 1px solid #d8dcde; border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.18); padding: 14px 16px; display: flex; gap: 12px; align-items: center; font-size: 13px; color: #2f3941; opacity: 0; transform: translateY(-8px); transition: opacity .35s, transform .35s; }
  .tg-dlfile.tg-on { opacity: 1; transform: none; }
  .tg-dlfile .tg-fic { width: 34px; height: 40px; border-radius: 4px; background: #07363f; color: #e8a61b; display: grid; place-items: center; font: 800 10px/1 Montserrat, sans-serif; flex: none; }
  .tg-dlfile b { display: block; font-size: 13px; overflow-wrap: anywhere; }
  .tg-dlfile small { color: #68737d; }

  .tg-head { height: 56px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 26px; border-bottom: 1px solid #e3e8e9; }
  .tg-head img { height: 30px; }
  .tg-head h1 { margin: 0; font: 700 19px/1 Montserrat, sans-serif; color: #07363f; }
  .tg-free { background: #e8a61b; color: #07363f; font: 800 11px/1 Montserrat, sans-serif; padding: 5px 9px; border-radius: 99px; letter-spacing: .06em; }
  .tg-cols { flex: 1; display: flex; min-height: 0; }

  /* left: the choices */
  .tg-opts { width: 430px; flex: none; border-right: 1px solid #e3e8e9; background: #f7f9f9; overflow: hidden; position: relative; }
  .tg-inner { position: relative; padding: 16px 24px 30px; }
  .tg-inner h3 { margin: 0 0 10px; font: 700 16px/1.2 Montserrat, sans-serif; color: #1d2b30; }
  .tg-q { margin-bottom: 14px; }
  .tg-q label { display: block; font-size: 13px; font-weight: 700; color: #33434a; margin-bottom: 7px; }
  .tg-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .tg-chip { font-size: 13px; padding: 7px 12px; border: 1px solid #c9d3d6; border-radius: 99px; background: #fff; color: #33434a; transition: background .25s, color .25s, border-color .25s; }
  .tg-chip.tg-on { background: #07363f; border-color: #07363f; color: #fff; }
  .tg-seg { display: inline-flex; border: 1px solid #c9d3d6; border-radius: 6px; overflow: hidden; background: #fff; }
  .tg-seg span { padding: 8px 20px; font-size: 13px; color: #33434a; transition: background .25s, color .25s; }
  .tg-seg span + span { border-left: 1px solid #c9d3d6; }
  .tg-seg span.tg-on { background: #07363f; color: #fff; }
  .tg-sel { position: relative; height: 36px; border: 1px solid #c9d3d6; border-radius: 5px; background: #fff; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #68737d; }
  .tg-list { position: absolute; left: -1px; right: -1px; top: 38px; z-index: 4; background: #fff; border: 1px solid #c9d3d6; border-radius: 6px; box-shadow: 0 12px 26px rgba(0,0,0,.14); padding: 4px 0; opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s; pointer-events: none; }
  .tg-list.tg-on { opacity: 1; transform: none; }
  .tg-list div { padding: 7px 12px; font-size: 13px; color: #33434a; }
  .tg-list div:nth-child(2) { background: #edf7ff; }
  .tg-more { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #1f6eb6; padding: 4px 0 2px; }
  .tg-sec { margin-top: 18px; padding-top: 16px; border-top: 2px solid #e3e8e9; }
  .tg-goes { font-size: 13px; color: #33434a; background: #fff; border: 1px solid #e3e8e9; border-radius: 6px; padding: 9px 12px; margin-bottom: 10px; }
  .tg-what { background: #fff; border: 1px solid #e3e8e9; border-radius: 6px; margin-bottom: 14px; }
  .tg-what-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 13px; font-weight: 700; color: #1f6eb6; }
  .tg-what-h i { font-style: normal; transition: transform .25s; display: inline-block; }
  .tg-what.tg-open .tg-what-h i { transform: rotate(90deg); }
  .tg-what-b { display: none; padding: 0 12px 10px; }
  .tg-what.tg-open .tg-what-b { display: block; animation: rowin .35s ease; }
  .tg-wrow { padding: 8px 0; border-top: 1px solid #eef1f2; font-size: 12px; }
  .tg-wrow .tg-pb { margin-bottom: 6px; }
  .tg-c { display: inline-block; background: #e8f2fb; border: 1px solid #c4dcf2; color: #1f5f99; border-radius: 99px; padding: 3px 9px; margin: 0 4px 4px 0; font-size: 11.5px; }
  .tg-c.tg-x { background: #f4f0fb; border-color: #dcd0f2; color: #5a3fd0; }
  .tg-links h4 { margin: 0 0 6px; font-size: 13px; color: #33434a; }
  .tg-note { font-size: 12.5px; color: #68737d; margin-bottom: 10px; transition: color .3s; }
  .tg-note.tg-ok { color: #2e8540; font-weight: 700; }
  .tg-dl { display: inline-flex; align-items: center; gap: 8px; background: #1f6eb6; color: #fff; font-size: 13px; font-weight: 600; padding: 9px 18px; border-radius: 5px; margin-bottom: 12px; }
  .tg-lrow { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .tg-lrow .tg-pb { width: 128px; flex: none; text-align: center; font-size: 12px; padding: 7px 0; }
  .tg-in { flex: 1; min-width: 0; height: 34px; border: 1px solid #c9d3d6; border-radius: 4px; background: #fff; display: flex; align-items: center; padding: 0 10px; font: 11.5px/1 Consolas, monospace; color: #9aa7ad; white-space: nowrap; overflow: hidden; transition: border-color .3s, background .3s; }
  .tg-in.tg-filled { color: #33434a; border-color: #2e8540; background: #f3faf4; }

  /* buttons in the email: placeholder vs linked */
  .tg-pb { display: inline-block; font: 700 15px/1 Arial, sans-serif; padding: 10px 22px; border-radius: 17px; white-space: nowrap; border: 2px dashed #9aa7ad; background: #eef1f2; color: #5b6c72; transition: background .4s, color .4s, border-color .4s; }
  .tg-pb.tg-real { border: 2px solid #5a5a5a; color: #fff; }

  /* right: the preview */
  .tg-prev { flex: 1; min-width: 0; padding: 16px 28px; display: flex; flex-direction: column; background: #fff; }
  .tg-ptop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .tg-tabs { display: flex; gap: 4px; }
  .tg-tabs span { padding: 7px 16px; font-size: 13px; font-weight: 600; color: #68737d; border-bottom: 3px solid transparent; }
  .tg-tabs span.tg-on { color: #07363f; border-bottom-color: #e8a61b; }
  .tg-sample { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #33434a; }
  .tg-box { width: 16px; height: 16px; border: 2px solid #8a979d; border-radius: 3px; display: grid; place-items: center; transition: background .2s, border-color .2s; }
  .tg-box.tg-on { background: #1f6eb6; border-color: #1f6eb6; }
  .tg-box svg { opacity: 0; } .tg-box.tg-on svg { opacity: 1; }
  .tg-mail { flex: 1; border: 1px solid #e3e8e9; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; position: relative; }
  .tg-subj { padding: 13px 20px; background: #f7f9f9; border-bottom: 1px solid #e3e8e9; font-size: 14px; color: #33434a; }
  .tg-subj b { color: #1d2b30; }
  .tg-body { padding: 20px 24px; font-size: 15px; line-height: 1.6; color: #2f3941; }
  .tg-body p { margin: 0 0 14px; }
  .tg-btns { display: flex; flex-wrap: wrap; gap: 12px; margin: 4px 0 18px; }
  .tg-ph { font: 12.5px/1.4 Consolas, monospace; background: #fff3d6; color: #6b4a07; border-radius: 3px; padding: 1px 4px; }
  .tg-code { position: absolute; inset: 0; background: #1d2b30; color: #cfe5e9; font: 12.5px/1.6 Consolas, monospace; padding: 18px 20px; overflow-wrap: anywhere; display: none; }
  .tg-code.tg-on { display: block; }
  .tg-pfoot { display: flex; justify-content: flex-end; margin-top: 12px; }
  .tg-copy { position: relative; display: inline-flex; align-items: center; gap: 8px; background: #07363f; color: #fff; font-size: 13.5px; font-weight: 600; padding: 10px 20px; border-radius: 5px; transition: background .25s; }
  .tg-copy.tg-on { background: #2e8540; }
  .tg-copied { position: absolute; right: 0; top: -36px; background: #1d2b30; color: #fff; font-size: 12px; padding: 7px 10px; border-radius: 5px; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  .tg-copy.tg-on .tg-copied { opacity: 1; }

  /* Klick-Zen import dialogs (laid over the Klick-Zen app) */
  .tg-ov { position: absolute; inset: 0; z-index: 8; background: rgba(13,30,36,.45); display: grid; place-items: center; opacity: 0; visibility: hidden; transition: opacity .35s, visibility .35s; }
  .tg-ov.tg-on { opacity: 1; visibility: visible; }
  .tg-dlg { width: 760px; background: #fff; border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.3); overflow: hidden; display: none; }
  .tg-dlg.tg-on { display: block; animation: rowin .35s ease; }
  .tg-dlg-h { padding: 16px 22px; border-bottom: 1px solid #e3e8e9; font-size: 18px; font-weight: 600; color: #1d2b30; display: flex; align-items: center; justify-content: space-between; }
  .tg-dlg-h small { font-size: 12.5px; font-weight: 400; color: #68737d; }
  .tg-dlg-b { padding: 16px 22px; }
  .tg-pick { border: 2px dashed #9fbfdf; border-radius: 8px; background: #f3f8fd; padding: 34px; text-align: center; font-size: 14px; color: #1f6eb6; font-weight: 600; }
  .tg-pick small { display: block; margin-top: 6px; font-weight: 400; color: #68737d; }
  .tg-sall { font-size: 12.5px; color: #1f6eb6; margin-bottom: 8px; }
  .tg-irow { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid #eef1f2; }
  .tg-chk { width: 18px; height: 18px; border-radius: 3px; background: #1f6eb6; display: grid; place-items: center; flex: none; }
  .tg-irow .tg-pb { width: 150px; text-align: center; flex: none; }
  .tg-irow .tg-nm { width: 130px; flex: none; font-size: 14px; color: #33434a; }
  .tg-irow .tg-sum { flex: 1; min-width: 0; }
  .tg-snip { flex: 1; min-width: 0; display: flex; align-items: center; height: 38px; border: 1px solid #1f6eb6; border-radius: 4px; overflow: hidden; }
  .tg-snip code { flex: 1; min-width: 0; padding: 0 12px; font: 12px/1 Consolas, monospace; color: #33434a; white-space: nowrap; overflow: hidden; }
  .tg-snip i { position: relative; width: 44px; height: 100%; background: #1f6eb6; display: grid; place-items: center; transition: background .25s; flex: none; }
  .tg-snip i.tg-on { background: #2e8540; }
  .tg-dlg-f { padding: 14px 22px; border-top: 1px solid #e3e8e9; display: flex; justify-content: flex-end; gap: 12px; }
  .tg-btn { padding: 10px 22px; border-radius: 5px; font-size: 14px; font-weight: 600; }
  .tg-btn.tg-out { border: 1px solid #1f6eb6; color: #1f6eb6; }
  .tg-btn.tg-pri { background: #1f6eb6; color: #fff; }

  /* inbox: the second button beside the kit's */
  .tg-mail-help { display: inline-block; font: 700 18px/1 Arial, sans-serif; padding: 11px 30px; border: 2px solid #5a5a5a; border-radius: 17px; background: #1f2a37; color: #fff; margin-left: 14px; }
  /* title card: the second button beside the kit's */
  .tg-demo-help { display: inline-block; font: 700 16px/1 Arial, sans-serif; padding: 11px 20px; border: 2px solid #5a5a5a; border-radius: 18px; background: #1f2a37; color: #fff; margin-left: 10px; }
  /* ticket: the tag added by the click */
  .tg-newtag { display: none; background: #fff3d6; border: 1px solid #f3d38b; color: #6b4a07; border-radius: 99px; padding: 3px 10px; font-size: 13px; animation: rowin .45s ease; }
  .tg-tagged .tg-newtag { display: inline-block; }
</style>
</head>
<body>
<div id="player"></div>
<script src="../../framework/engine/player.js"></script>
<script src="../../framework/kit/klickzen.js"></script>
<script src="walkthrough.js"></script>
</body>
</html>
