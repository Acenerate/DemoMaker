<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klick-Zen: Landing Pages</title>
<meta name="description" content="An animated walkthrough: brand the page your customers see after they click a Klick-Zen button.">
<link rel="icon" href="../../framework/assets/favicon.ico">
<link rel="stylesheet" href="../../framework/engine/player.css">
<link rel="stylesheet" href="../../framework/kit/klickzen.css">
<style>
  /* Custom scenes for this walkthrough. Every class and id is prefixed lp- so kit changes can't reach
     them; only the Zendesk sidebar (KZKit.zdNav) and the Klick-Zen mark come from the kit. */

  /* ---------- scene "lp": the Klick-Zen Default Landing Page screen, inside Zendesk */
  .lp-shell { position: absolute; inset: 0; display: flex; background: #f8f9f9; }
  .lp-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .lp-top { height: 50px; background: #fff; border-bottom: 1px solid #d8dcde; display: flex; align-items: center; padding: 0 18px; gap: 10px; flex: none; }
  .lp-tab { height: 50px; display: flex; align-items: center; padding: 0 16px; border-right: 1px solid #e9ebed; font-size: 13px; color: #49545c; }
  .lp-tab.lp-on { box-shadow: inset 0 -3px 0 #1f73b7; color: #2f3941; font-weight: 600; }
  .lp-sp { flex: 1; }
  .lp-avatar { width: 30px; height: 30px; border-radius: 50%; background: #c7d7da; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #03363d; }
  .lp-app { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #f6f8f8; }
  .lp-head { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: #fff; border-bottom: 1px solid #e3e8e9; font-weight: 600; font-size: 14px; color: #1d2b30; }
  .lp-mark { width: 30px; height: 30px; border-radius: 6px; background: #07363f; display: grid; place-items: center; }
  .lp-cols { flex: 1; display: flex; min-height: 0; }
  .lp-side { width: 250px; flex: none; padding: 22px 18px; border-right: 1px solid #e3e8e9; }
  .lp-side h6 { margin: 18px 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .02em; color: #1d2b30; }
  .lp-side h6:first-child { margin-top: 4px; }
  .lp-side hr { border: 0; border-top: 1px solid #dfe5e6; margin: 0 0 8px; }
  .lp-side div { padding: 7px 12px; border-radius: 6px; font-size: 14px; color: #33434a; }
  .lp-side div.lp-on { background: #d3e4f3; font-weight: 600; color: #1d2b30; }
  .lp-content { flex: 1; overflow: hidden; position: relative; }
  .lp-scroll { position: relative; padding: 20px 30px 40px; }
  .lp-titlebar h2 { margin: 0; font-size: 22px; font-weight: 400; color: #1d2b30; }
  .lp-titlebar h2 b { font-weight: 700; }

  fieldset.lp-fs { border: 2px solid #1f6eb6; border-radius: 10px; margin: 18px 0 0; padding: 10px 22px 20px; }
  fieldset.lp-fs legend { color: #1f6eb6; font-size: 17px; font-weight: 600; padding: 0 8px; }
  .lp-grid { display: grid; grid-template-columns: 170px 1fr; align-items: center; row-gap: 16px; margin-top: 8px; font-size: 13px; }
  .lp-grid > label { font-weight: 600; color: #33434a; }
  .lp-in { width: 360px; height: 38px; border: 1px solid #d3dbde; border-radius: 4px; background: #fff; display: flex; align-items: center; padding: 0 12px; font-size: 14px; color: #33434a; transition: border-color .25s, box-shadow .25s; }
  .lp-in.lp-focus { border-color: #5b9bd5; box-shadow: 0 0 0 3px rgba(31,110,182,.18); }
  .lp-colors { display: flex; align-items: center; gap: 10px; color: #33434a; }
  .lp-colors span.lp-l { margin-left: 14px; }
  .lp-colors span.lp-l:first-child { margin-left: 0; }
  .lp-sw { width: 72px; height: 36px; border: 1px solid #d3dbde; border-radius: 4px; background: #fff; padding: 5px; }
  .lp-sw div { width: 100%; height: 100%; border: 1px solid rgba(0,0,0,.1); transition: background-color .5s; }
  .lp-img { display: flex; align-items: center; gap: 16px; position: relative; }
  .lp-thumb { width: 170px; height: 56px; border: 1px solid #d3dbde; border-radius: 4px; background: #fff; display: grid; place-items: center; font-size: 13px; }
  .lp-btn-out { border: 1px solid #1f6eb6; color: #1f6eb6; background: #fff; padding: 8px 18px; border-radius: 4px; font-size: 13px; }
  .lp-files { position: absolute; left: 186px; top: 46px; z-index: 6; width: 230px; background: #fff; border: 1px solid #c9d3d6; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 6px; opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s; pointer-events: none; }
  .lp-files.lp-on { opacity: 1; transform: none; }
  .lp-files div { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 4px; font-size: 13px; color: #33434a; }
  .lp-files div:first-child { background: #e8f2fb; }
  .lp-files i { width: 22px; height: 18px; border-radius: 3px; background: #d3e4f3; flex: none; }

  .lp-fsbar { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 10px; }
  .lp-hint { font-size: 11.5px; font-style: italic; color: #68737d; }
  .lp-prev { border: 1px solid #1f6eb6; color: #1f6eb6; background: #fff; padding: 7px 16px; border-radius: 4px; font-size: 12.5px; transition: all .3s; }
  .lp-prev.lp-dim { border-color: #e3e8e9; background: #eef1f2; color: #a8b2b6; }
  .lp-ed { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; height: 196px; }
  .lp-edit { border: 1px solid #d3dbde; border-radius: 4px; background: #fff; display: flex; flex-direction: column; min-height: 0; transition: border-color .25s, box-shadow .25s; }
  .lp-edit.lp-focus { border-color: #5b9bd5; box-shadow: 0 0 0 3px rgba(31,110,182,.18); }
  .lp-tools { display: flex; gap: 2px; padding: 5px 8px; border-bottom: 1px solid #e3e8e9; background: #f7f9f9; }
  .lp-tools span { width: 28px; height: 26px; border-radius: 4px; display: grid; place-items: center; font: 700 13px/1 Arial, sans-serif; color: #4b5a66; }
  .lp-tools span.lp-i { font-style: italic; font-family: Georgia, serif; }
  .lp-tools .lp-div { width: 1px; background: #dfe5e6; margin: 3px 4px; }
  .lp-md { flex: 1; padding: 10px 12px; font: 12.5px/1.55 Consolas, monospace; color: #33434a; white-space: pre-wrap; overflow: hidden; }
  .lp-pv { border: 1px dashed #c9d3d6; border-radius: 4px; background: #fff; padding: 10px 16px; overflow: hidden; color: #3b3b3b; font-family: "Helvetica Neue", Arial, sans-serif; }
  .lp-pv h1 { margin: 0 0 4px; font-size: 24px; font-weight: 400; }
  .lp-pv h2 { margin: 0 0 10px; font-size: 16px; font-weight: 400; }
  .lp-pv p { margin: 0 0 8px; font-size: 12.5px; line-height: 1.45; }
  .lp-foot { margin-top: 22px; }
  .lp-update { display: inline-block; background: #1f6eb6; color: #fff; width: 120px; text-align: center; padding: 12px 0; border-radius: 5px; font-size: 14px; }
  .lp-toast { position: absolute; right: 30px; top: 16px; z-index: 5; background: #2e8540; color: #fff; padding: 12px 18px; border-radius: 6px; font-size: 13.5px; font-weight: 600; display: flex; gap: 10px; align-items: center; opacity: 0; transform: translateY(-8px); transition: opacity .35s, transform .35s; box-shadow: 0 8px 20px rgba(0,0,0,.15); }
  .lp-toast.lp-on { opacity: 1; transform: none; }

  /* the example company logo (sized by font-size) */
  .lp-acme { display: inline-flex; align-items: center; gap: .45em; font: 800 1em/1 Montserrat, sans-serif; color: #1f2a37; letter-spacing: -.01em; white-space: nowrap; }
  .lp-acme i { width: 1.55em; height: 1.55em; border-radius: 50%; background: #2563d9; color: #fff; display: grid; place-items: center; font-style: normal; font-size: .9em; }
  /* the placeholder until a logo is uploaded (also sized by font-size) */
  .lp-nologo { display: inline-block; padding: .4em .9em; border: 1px dashed #aab5ba; border-radius: 4px; font: 600 1em/1 Montserrat, sans-serif; color: #8a979d; white-space: nowrap; }

  /* ---------- scene "web": the customer's browser showing the landing page */
  .lp-web { background: #cfd8dc; }
  .lp-br { position: absolute; left: 70px; top: 26px; right: 70px; bottom: 26px; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; }
  .lp-br-tabs { height: 40px; background: #cdd4da; display: flex; align-items: flex-end; padding: 0 12px 0 84px; flex: none; position: relative; }
  .lp-br-tabs .lp-dots { position: absolute; left: 16px; top: 14px; display: flex; gap: 7px; }
  .lp-br-tabs .lp-dots i { width: 12px; height: 12px; border-radius: 50%; background: #f26b5b; }
  .lp-br-tabs .lp-dots i:nth-child(2) { background: #f6be4f; } .lp-br-tabs .lp-dots i:nth-child(3) { background: #5fc454; }
  .lp-br-tab { width: 240px; height: 32px; background: #dee3e8; border-radius: 9px 9px 0 0; display: flex; align-items: center; gap: 9px; padding: 0 12px; font-size: 13px; color: #2f3941; }
  .lp-br-tab span:nth-child(2) { flex: 1; overflow: hidden; white-space: nowrap; }
  .lp-br-tab i { font-style: normal; color: #6b7882; }
  .lp-fav { width: 16px; height: 16px; display: grid; place-items: center; flex: none; }
  .lp-fav .lp-acme { font-size: 9px; }
  .lp-fav .lp-acme b { display: none; }
  .lp-br-tab i.lp-nofav { display: block; width: 12px; height: 12px; border-radius: 50%; background: #aab5ba; }
  .lp-br-bar { height: 44px; background: #dee3e8; display: flex; align-items: center; padding: 0 16px 8px; flex: none; }
  .lp-br-url { flex: 1; height: 32px; background: #fff; border-radius: 99px; display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 13px; color: #4b5a66; }
  .lp-page { flex: 1; position: relative; transition: background-color .5s; }
  .lp-page-head { background: #fff; height: 122px; display: grid; place-items: center; border-bottom: 14px solid #07363f; transition: border-color .5s; }
  .lp-page-head .lp-acme { font-size: 34px; }
  .lp-page-head .lp-nologo { font-size: 22px; }
  .lp-page-body { padding: 24px 46px; font-family: "Helvetica Neue", Arial, sans-serif; transition: color .5s; animation: lp-fade .5s ease; }
  @keyframes lp-fade { from { opacity: 0; } }
  .lp-page-body h1 { margin: 0; font-size: 44px; font-weight: 400; }
  .lp-page-body h2 { margin: 12px 0 0; padding-bottom: 20px; border-bottom: 1px solid rgba(0,0,0,.12); font-size: 26px; font-weight: 400; }
  .lp-page-body p { margin: 18px 0 0; font-size: 16px; line-height: 1.5; max-width: 820px; }
</style>
</head>
<body>
<div id="player"></div>
<script src="../../framework/engine/player.js"></script>
<script src="../../framework/kit/klickzen.js"></script>
<script src="walkthrough.js"></script>
</body>
</html>
