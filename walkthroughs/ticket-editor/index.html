<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klick-Zen: Using Buttons in the Ticket Editor</title>
<meta name="description" content="An animated walkthrough: drop Klick-Zen one-click buttons straight into a Zendesk ticket reply.">
<link rel="icon" href="../../framework/assets/favicon.ico">
<link rel="stylesheet" href="../../framework/engine/player.css">
<link rel="stylesheet" href="../../framework/kit/klickzen.css">
<style>
  /* Custom scene "reply": a Zendesk ticket with the reply composer open. All classes and ids are
     prefixed te- so kit changes can't reach them; only the sidebar comes from the kit (KZKit.zdNav). */
  .te-shell { position: absolute; inset: 0; display: flex; background: #f8f9f9; }
  .te-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .te-top { height: 50px; background: #fff; border-bottom: 1px solid #d8dcde; display: flex; align-items: center; padding: 0 18px; gap: 10px; flex: none; }
  .te-tab { height: 50px; display: flex; align-items: center; padding: 0 16px; border-right: 1px solid #e9ebed; font-size: 13px; color: #49545c; }
  .te-tab.te-on { box-shadow: inset 0 -3px 0 #1f73b7; color: #2f3941; font-weight: 600; }
  .te-sp { flex: 1; }
  .te-avatar { width: 30px; height: 30px; border-radius: 50%; background: #c7d7da; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #03363d; }
  .te-body { flex: 1; position: relative; overflow: hidden; }
  .te-ticket { position: absolute; inset: 0; display: flex; }

  /* ticket properties (left column) */
  .te-props { width: 270px; background: #fff; border-right: 1px solid #d8dcde; padding: 18px; display: flex; flex-direction: column; gap: 14px; font-size: 13px; }
  .te-props label { display: block; font-weight: 600; margin-bottom: 5px; color: #2f3941; }
  .te-field { height: 36px; border: 1px solid #c2c8cc; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: #2f3941; background: #fff; }
  .te-tag { background: #e8f2fb; border: 1px solid #c4dcf2; color: #1f5f99; border-radius: 99px; padding: 3px 10px; }

  /* conversation */
  .te-conv { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .te-head { padding: 18px 26px 14px; border-bottom: 1px solid #e9ebed; background: #fff; display: flex; align-items: center; gap: 14px; }
  .te-head h3 { margin: 0; font-size: 20px; font-weight: 600; color: #2f3941; }
  .te-head span { color: #87929d; }
  .te-status { min-width: 54px; text-align: center; font: 700 11px/1 "Segoe UI", sans-serif; padding: 5px 8px; border-radius: 4px; color: #fff; background: #e34f32; font-style: normal; }
  .te-msgs { padding: 18px 26px 10px; }
  .te-msg { display: flex; gap: 12px; }
  .te-av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; background: #dbe8ea; color: #03363d; }
  .te-bub { background: #fff; border: 1px solid #e9ebed; border-radius: 8px; padding: 12px 16px; max-width: 640px; font-size: 13.5px; }
  .te-bub small { display: block; color: #87929d; margin-bottom: 4px; }

  /* the reply composer */
  .te-reply { margin: 0 26px 18px; background: #fff; border: 1px solid #c2c8cc; border-radius: 8px; display: flex; flex-direction: column; flex: 1; min-height: 0; position: relative; }
  .te-reply.te-focus { border-color: #1f73b7; box-shadow: 0 0 0 3px rgba(31,115,183,.15); }
  .te-rhead { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid #e9ebed; font-size: 13.5px; color: #49545c; }
  .te-rhead b { color: #2f3941; font-weight: 600; }
  .te-to { display: inline-flex; align-items: center; gap: 7px; background: #e9ebed; border-radius: 99px; padding: 3px 12px 3px 3px; color: #2f3941; font-weight: 600; }
  .te-to i { width: 22px; height: 22px; border-radius: 50%; background: #dbe8ea; color: #03363d; display: grid; place-items: center; font: 700 10px/1 "Segoe UI", sans-serif; }
  .te-text { flex: 1; padding: 14px 18px; font-size: 15px; line-height: 1.5; color: #2f3941; white-space: pre-wrap; overflow: hidden; }
  .te-tools { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-top: 1px solid #e9ebed; color: #68737d; }
  .te-tool { width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center; }
  .te-tool.te-on { background: #e3eefa; }
  .te-foot { display: flex; justify-content: flex-end; padding: 0 26px 16px; }
  .te-submit { background: #2f3941; color: #fff; border-radius: 4px; padding: 10px 18px; font-size: 14px; font-weight: 600; }

  /* Klick-Zen button images: in the pop-up, and inserted into the reply */
  .te-btn { display: inline-block; font: 700 14px/1 Arial, sans-serif; padding: 7px 16px; border: 2px solid; border-radius: 18px; color: #fff; }
  .te-text .te-btn { font-size: 15px; padding: 8px 20px; margin: 4px 10px 4px 0; vertical-align: middle; animation: te-pop .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes te-pop { from { opacity: 0; transform: scale(.6); } }
  .te-picker { position: absolute; left: 150px; bottom: 54px; background: #fff; border: 1px solid #d8dcde; border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.18); padding: 12px; display: flex; gap: 10px; opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; pointer-events: none; }
  .te-picker.te-on { opacity: 1; transform: none; }

  /* the resolved link under an inserted button */
  .te-tip { position: absolute; left: 18px; background: #2f3941; color: #fff; border-radius: 6px; padding: 9px 14px; font: 13px/1.3 Consolas, monospace; white-space: nowrap; opacity: 0; transform: translateY(-4px); transition: opacity .3s, transform .3s; z-index: 3; }
  .te-tip.te-on { opacity: 1; transform: none; }
  .te-tip b { background: #e8a61b; color: #07363f; border-radius: 3px; padding: 0 4px; }

  /* "Reply sent" notice */
  .te-toast { position: absolute; left: 50%; top: 16px; transform: translate(-50%, -10px); opacity: 0; background: #2f3941; color: #fff; padding: 12px 20px; border-radius: 6px; font-size: 14px; display: flex; gap: 10px; align-items: center; transition: opacity .3s, transform .3s; z-index: 5; }
  .te-toast.te-on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="player"></div>
<script src="../../framework/engine/player.js"></script>
<script src="../../framework/kit/klickzen.js"></script>
<script src="walkthrough.js"></script>
</body>
</html>
