<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klick-Zen Walkthroughs</title>
<link rel="icon" href="../framework/assets/favicon.ico">
<style>
  @font-face { font-family: 'Montserrat'; src: url(../framework/assets/montserrat-latin.woff2) format('woff2'); font-weight: 400 800; font-display: swap; }
  :root { --bg: #e9eef0; --card: #fff; --fg: #16262b; --muted: #5b6c72; --line: #d3dbde; --accent: #e8a61b; --brand: #07363f; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b1214; --card: #152024; --fg: #e4edef; --muted: #98abb1; --line: #273539; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #0b1214; --card: #152024; --fg: #e4edef; --muted: #98abb1; --line: #273539; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; padding: 40px 16px; }
  main { max-width: 900px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  header img { height: 34px; }
  .dark-logo { display: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .light-logo { display: none; } :root:not([data-theme="light"]) .dark-logo { display: block; } }
  h1 { font: 800 26px/1.2 Montserrat, sans-serif; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card b { display: block; font: 700 17px/1.3 Montserrat, sans-serif; margin-bottom: 6px; }
  .card span { color: var(--muted); font-size: 14px; }
  .card small { display: inline-block; margin-top: 12px; font-weight: 600; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }
</style>
</head>
<body>
<main>
  <header>
    <img class="light-logo" src="../framework/assets/klick-zen-logo.png" alt="Klick-Zen">
    <img class="dark-logo" src="../framework/assets/klick-zen-logo-dark.png" alt="Klick-Zen">
    <div><h1>Walkthroughs</h1><p>Animated, step-by-step tours of Klick-Zen.</p></div>
  </header>
  <div class="grid" id="grid"></div>
</main>
<script src="gallery.js"></script>
<script>
  // The list lives in gallery.js (edited by the admin tool).
  const WALKTHROUGHS = window.WALKTHROUGHS || [];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  document.getElementById('grid').innerHTML = WALKTHROUGHS.map(w =>
    `<a class="card" href="${esc(w.folder)}/index.html"><b>${esc(w.title)}</b><span>${esc(w.summary)}</span><br><small>${esc(w.length)}</small></a>`).join('');
</script>
</body>
</html>
