<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Klick-Zen Works</title>
<link rel="icon" href="../../framework/assets/favicon.ico">
<link rel="stylesheet" href="../../framework/engine/player.css">
<link rel="stylesheet" href="../../framework/kit/klickzen.css">
<style>
  /* Custom "what happens on a click" scene for this walkthrough (hw- prefix). Sized for the 1280x720 stage. */
  .hw-scene { background: #eef3f4; }
  .hw-scene .cam { position: relative; width: 1280px; height: 720px; }
  .hw-h { position: absolute; left: 60px; top: 44px; margin: 0; font: 800 34px/1.2 Montserrat, sans-serif; color: #07363f; letter-spacing: -.01em; }
  .hw-btnimg { display: inline-block; font: 700 18px/1 Arial, sans-serif; padding: 11px 28px; border: 2px solid #5a5a5a; border-radius: 17px; background: #17700f; color: #fff; }

  .hw-node { position: absolute; top: 128px; height: 300px; box-sizing: border-box; background: #fff; border-radius: 16px; padding: 22px 24px;
    box-shadow: 0 14px 34px rgba(7,54,63,.12); color: #2f3941; transition: box-shadow .4s; }
  .hw-node.hw-glow { box-shadow: 0 0 0 3px #e8a61b, 0 14px 34px rgba(7,54,63,.18); }
  .hw-nh { font: 700 12px/1 Montserrat, sans-serif; letter-spacing: .08em; color: #68737d; margin-bottom: 8px; text-transform: uppercase; }
  .hw-nt { font: 800 20px/1.2 Montserrat, sans-serif; color: #07363f; margin-bottom: 16px; }
  #hw-n-mail { left: 60px; width: 300px; }
  #hw-n-kz { left: 470px; width: 340px; background: #07363f; color: #fff; }
  #hw-n-kz .hw-nh { color: #8fb9c0; } #hw-n-kz .hw-nt { color: #fff; display: flex; align-items: center; gap: 10px; }
  #hw-n-zd { left: 920px; width: 300px; }
  .hw-mfrom { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 12px; }
  .hw-mfrom i { width: 32px; height: 32px; border-radius: 50%; background: #dbe8ea; color: #07363f; display: grid; place-items: center; font: 700 14px Montserrat, sans-serif; font-style: normal; }
  .hw-mtext { font-size: 15px; line-height: 1.45; margin: 0 0 18px; }
  .hw-chk { display: flex; align-items: center; gap: 12px; font: 600 16px/1.3 Montserrat, sans-serif; color: #8fb9c0; margin-bottom: 16px; transition: color .35s; }
  .hw-chk i { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 2px solid #3d6d75; display: grid; place-items: center; transition: background .35s, border-color .35s; }
  .hw-chk i svg { opacity: 0; transition: opacity .35s; }
  .hw-chk.hw-on { color: #fff; }
  .hw-chk.hw-on i { background: #2e8540; border-color: #2e8540; }
  .hw-chk.hw-on i svg { opacity: 1; }
  .hw-tk { border: 1px solid #e3e8e9; border-radius: 10px; padding: 14px; }
  .hw-tk-row { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 12px; }
  .hw-badge { font: 700 11px/1 Arial, sans-serif; text-transform: uppercase; padding: 5px 8px; border-radius: 4px; background: #e34f32; color: #fff; transition: background .4s; }
  .hw-badge.hw-solved { background: #68737d; }
  .hw-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .hw-tag { font-size: 12.5px; padding: 4px 9px; border-radius: 4px; background: #e9ebed; color: #2f3941; }
  .hw-tag.hw-new { background: #fdf1d8; color: #7a5300; opacity: 0; transform: scale(.8); transition: opacity .35s, transform .35s cubic-bezier(.3,1.6,.5,1); }
  .hw-tag.hw-new.hw-on { opacity: 1; transform: none; }
  .hw-trig { margin-top: 16px; display: flex; align-items: center; gap: 8px; font: 600 14px/1.35 Montserrat, sans-serif; color: #07363f; padding: 10px 12px; border-radius: 8px;
    background: #fdf1d8; opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .4s; }
  .hw-trig.hw-on { opacity: 1; transform: none; }
  .hw-trig svg { flex: none; }
  .hw-arrow { position: absolute; top: 262px; height: 60px; }
  #hw-a1 { left: 368px; width: 94px; } #hw-a2 { left: 818px; width: 94px; }
  .hw-line { position: absolute; left: 0; right: 10px; top: 0; height: 4px; border-radius: 2px; background: #b8c6ca; overflow: hidden; transition: background .3s; }
  .hw-arrow::after { content: ''; position: absolute; right: 0; top: -6px; border: 8px solid transparent; border-left: 12px solid #b8c6ca; border-right: 0; transition: border-color .3s; }
  .hw-arrow.hw-live .hw-line { background: #e8a61b; }
  .hw-arrow.hw-live::after { border-left-color: #e8a61b; }
  .hw-line::before { content: ''; position: absolute; top: 0; left: -30px; width: 30px; height: 4px; background: #fff; opacity: 0; }
  .hw-arrow.hw-live .hw-line::before { opacity: .9; animation: hw-flow 1s linear infinite; }
  @keyframes hw-flow { from { left: -30px; } to { left: 100%; } }
  .hw-al { position: absolute; left: -8px; right: -8px; top: 14px; text-align: center; font: 700 12px/1.3 Montserrat, sans-serif; color: #5b6c72; }
  .hw-guard { position: absolute; left: 60px; right: 60px; top: 500px; display: flex; justify-content: center; gap: 14px; }
  .hw-g { display: flex; align-items: center; gap: 9px; padding: 12px 20px; border-radius: 99px; background: #07363f; color: #fff; font: 600 17px/1 Montserrat, sans-serif;
    opacity: 0; transform: translateY(12px); transition: opacity .4s, transform .4s; white-space: nowrap; }
  .hw-g.hw-on { opacity: 1; transform: none; }
</style>
</head>
<body>
<div id="player"></div>
<script src="../../framework/engine/player.js"></script>
<script src="../../framework/kit/klickzen.js"></script>
<script src="walkthrough.js"></script>
</body>
</html>
