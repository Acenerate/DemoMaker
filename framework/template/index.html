<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klick-Zen Walkthrough Template</title>
<link rel="icon" href="../../framework/assets/favicon.ico">
<link rel="stylesheet" href="../../framework/engine/player.css">
<link rel="stylesheet" href="../../framework/kit/klickzen.css">
<style>
  /* Styles for this walkthrough's own custom scenes. Size things for the 1280x720 stage. */
  .demo-scene { background: #f6f8f8; display: grid; place-items: center; }
  .demo-panel { width: 620px; background: #fff; border: 1px solid #e3e8e9; border-radius: 12px; padding: 28px 32px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  .demo-panel h3 { margin: 0 0 6px; font-size: 22px; color: #1d2b30; }
  .demo-panel p { margin: 0 0 18px; color: #5b6c72; }
  .demo-field { height: 42px; border: 1px solid #c9d3d6; border-radius: 6px; display: flex; align-items: center; padding: 0 12px; font-size: 16px; margin-bottom: 14px; }
  .demo-go { display: inline-block; background: #1f6eb6; color: #fff; border-radius: 6px; padding: 11px 22px; font-weight: 600; }
  .demo-done { margin-top: 16px; color: #2e8540; font-weight: 700; opacity: 0; transition: opacity .4s; }
  .demo-done.on { opacity: 1; }
</style>
</head>
<body>
<div id="player"></div>
<script src="../../framework/engine/player.js"></script>
<script src="../../framework/kit/klickzen.js"></script>
<script src="walkthrough.js"></script>
</body>
</html>
